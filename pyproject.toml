[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmemdb"
dynamic = ["version"]
description = "Local-first, shared long-term memory for AI agents: one SQLite database for Claude Code, omp and any MCP client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harsh Gulhane" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.26,<2"]
keywords = ["mcp", "mcp-server", "ai-memory", "agent-memory", "sqlite", "local-first", "claude-code", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/harsh-gulhane/agentmemdb"
Documentation = "https://github.com/harsh-gulhane/agentmemdb/tree/main/docs"
Source = "https://github.com/harsh-gulhane/agentmemdb"
Issues = "https://github.com/harsh-gulhane/agentmemdb/issues"
Changelog = "https://github.com/harsh-gulhane/agentmemdb/blob/main/CHANGELOG.md"

[project.scripts]
agentmemdb = "agentmemdb.cli:main"

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.15",
    "twine>=6",
]

[tool.setuptools.dynamic]
version = { attr = "agentmemdb.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentmemdb = ["icon.svg", "py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# Leaked SQLite connections fail the run: they are how a database ends up locked
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["agentmemdb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
